name: collect

on:
  schedule:
    - cron: "7 * * * *"   # hourly at :07 (on-the-hour slots are congested and drift)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        run: python collector.py
      - name: Commit data
        run: |
          git config user.name "odds-drift-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "collect $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
